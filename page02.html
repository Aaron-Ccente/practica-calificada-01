<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página 02</title>
  <link rel="stylesheet" href="css/globals.css">
</head>
<body>
  <a href="index.html" class="btn-back">← Volver al Inicio</a>

  <div class="window">
    <div class="window-bar">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5s-1.12-2.5-2.5-2.5z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
    </div>

    <div class="window-body">
      <div class="stepper">
        <div class="step">
          <span class="step-num">1</span>
          <span>Revisar Pedido</span>
        </div>
        <div class="step-line"></div>
        <div class="step active">
          <span class="step-num">2</span>
          <span>Seleccionar Envío</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
          <span class="step-num">3</span>
          <span>Confirmar</span>
        </div>
      </div>

      <h3 style="margin-bottom: 8px;">Envío</h3>
      <p style="color: #888; font-size: 13.5px; margin-bottom: 14px;">Método de entrega</p>

      <div class="radio-group">
        <label class="radio-item">
          <input type="radio" name="shipping" checked>
          <span>Envío Estándar</span>
        </label>
        <label class="radio-item">
          <input type="radio" name="shipping">
          <span>Envío Prioritario</span>
        </label>
        <label class="radio-item">
          <input type="radio" name="shipping">
          <span>Envío Exprés</span>
        </label>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
        <button type="button" class="btn" style="background: transparent; border: none; color: #888;">ANTERIOR</button>
        <button type="button" class="btn">SIGUIENTE</button>
      </div>
    </div>
  </div>

  <div class="rgb-card">
    <div class="rgb-preview" id="rgbBox"></div>
    <div class="rgb-body">
      <div class="rgb-row">
        <span>R</span>
        <input type="range" id="rRange" min="0" max="255" value="80" oninput="document.getElementById('rVal').value=this.value; document.getElementById('rgbBox').style.backgroundColor='rgb('+this.value+','+document.getElementById('gVal').value+','+document.getElementById('bVal').value+')'">
        <input type="number" id="rVal" min="0" max="255" value="80" oninput="document.getElementById('rRange').value=this.value; document.getElementById('rgbBox').style.backgroundColor='rgb('+this.value+','+document.getElementById('gVal').value+','+document.getElementById('bVal').value+')'">
      </div>
      <div class="rgb-row">
        <span>G</span>
        <input type="range" id="gRange" min="0" max="255" value="165" oninput="document.getElementById('gVal').value=this.value; document.getElementById('rgbBox').style.backgroundColor='rgb('+document.getElementById('rVal').value+','+this.value+','+document.getElementById('bVal').value+')'">
        <input type="number" id="gVal" min="0" max="255" value="165" oninput="document.getElementById('gRange').value=this.value; document.getElementById('rgbBox').style.backgroundColor='rgb('+document.getElementById('rVal').value+','+this.value+','+document.getElementById('bVal').value+')'">
      </div>
      <div class="rgb-row">
        <span>B</span>
        <input type="range" id="bRange" min="0" max="255" value="92" oninput="document.getElementById('bVal').value=this.value; document.getElementById('rgbBox').style.backgroundColor='rgb('+document.getElementById('rVal').value+','+document.getElementById('gVal').value+','+this.value+')'">
        <input type="number" id="bVal" min="0" max="255" value="92" oninput="document.getElementById('bRange').value=this.value; document.getElementById('rgbBox').style.backgroundColor='rgb('+document.getElementById('rVal').value+','+document.getElementById('gVal').value+','+this.value+')'">
      </div>
    </div>
  </div>
</body>
</html>
