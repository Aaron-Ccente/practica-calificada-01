<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>page01 - a) Animación de label</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --panel: #121218;
        --text: #e8e8ec;
        --placeholder: #7d7d8a;
        --celeste: #6ee7f2;
        --white: #f2f2f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, #17171f 0%, #0b0b0f 60%);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        padding: 40px 16px;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: var(--panel);
        border-radius: 12px;
        padding: 28px 24px;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.03);
      }

      /* ---------- Campo de texto con animación de label ---------- */
      .field {
        position: relative;
      }

      .field input[type="text"],
      .field input[type="email"] {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1.5px solid var(--white);
        color: var(--text);
        font-size: 15px;
        padding: 10px 2px 10px 2px;
        outline: none;
        font-family: inherit;
      }

      .field label {
        position: absolute;
        left: 2px;
        top: 10px;
        color: var(--placeholder);
        font-size: 15px;
        pointer-events: none;
        transition:
          transform 0.22s ease,
          color 0.22s ease,
          top 0.22s ease;
        transform-origin: left top;
      }

      /* Estado activo: el texto sube, se encoge y cambia de blanco/gris a celeste agua */
      .field.filled label,
      .field input:focus + label {
        top: -14px;
        transform: scale(0.78);
        color: var(--celeste);
      }

      .field input:focus {
        border-bottom-color: var(--celeste);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="field">
        <input type="email" id="email" name="email" autocomplete="off" />
        <label for="email">Email</label>
      </div>
    </div>

    <script>
      // Animación del label: sube, se encoge y cambia de color al hacer focus o al escribir
      document.querySelectorAll(".field input").forEach(function (input) {
        var field = input.closest(".field");
        var sync = function () {
          field.classList.toggle("filled", input.value.trim().length > 0);
        };
        input.addEventListener("input", sync);
        input.addEventListener("blur", sync);
        sync();
      });
    </script>
  </body>
</html>
