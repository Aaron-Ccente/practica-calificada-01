<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Principal - Práctica 1</title>
  <link rel="stylesheet" href="css/globals.css">
</head>
<body>
  <div class="hub">
    <h1>Práctica Calificada 1</h1>
    <p style="color: #666; margin-top: 6px;">Desarrollo de Aplicaciones Web</p>

    <div class="cards-row">
      <div class="card-flip">
        <div class="card-flip-inner">
          <div class="card-front card-p1">
            <h3>page1</h3>
            <p>Formulario y Ventana</p>
          </div>
          <div class="card-back">
            <a href="page01.html">Ir a Página 1</a>
          </div>
        </div>
      </div>

      <div class="card-flip">
        <div class="card-flip-inner">
          <div class="card-front card-p2">
            <h3>page2</h3>
            <p>Pasos y Selector RGB</p>
          </div>
          <div class="card-back">
            <a href="page02.html">Ir a Página 2</a>
          </div>
        </div>
      </div>

      <div class="card-flip">
        <div class="card-flip-inner">
          <div class="card-front card-p3">
            <h3>page3</h3>
            <p>Tienda Virtual</p>
          </div>
          <div class="card-back">
            <a href="page03.html">Ir a Página 3</a>
          </div>
        </div>
      </div>
    </div>

    <div class="login-box">
      <div class="login-field">
        <label for="log-email">Correo electrónico</label>
        <input type="email" id="log-email">
      </div>

      <div class="login-field error">
        <label for="log-pass">Contraseña</label>
        <input type="password" id="log-pass" placeholder="Ingrese su contraseña">
        <span class="login-error">El campo es obligatorio</span>
      </div>

      <button type="button" class="btn-signin">INICIAR SESIÓN</button>
    </div>
  </div>
</body>
</html>
